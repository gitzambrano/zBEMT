name: Apply flight sign convention to main ARM

on:
  push:
    branches:
      - fix/unify-alpha-vz-sign-convention
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-main-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-alpha-vz-sign-convention
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply validated patch to main and push
        run: |
          set -euo pipefail
          git fetch origin main fix/unify-alpha-vz-sign-convention
          if git show origin/main:zbemt/nomenclature.py | grep -q 'def alpha_disk_cross_velocity'; then
            echo 'main already contains the sign-convention fix'
            exit 0
          fi
          git show origin/fix/unify-alpha-vz-sign-convention:tools/apply_flight_sign_fix.py > /tmp/apply_flight_sign_fix.py
          git checkout -B main origin/main
          cp /tmp/apply_flight_sign_fix.py tools/_apply_flight_sign_fix.py
          python tools/_apply_flight_sign_fix.py || true
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/documentation.html')
          s = p.read_text(encoding='utf-8')
          for old, new in [
              (r'$\alpha_{rotor}=\operatorname{atan2}(V_z,V_x)$', r'$\alpha_{rotor}=-\operatorname{atan2}(V_z,V_x)$'),
              (r'$\mu_x=\tan(\alpha_{disk})\,|V_z|/(\Omega R)$', r'$\mu_x=-\tan(\alpha_{disk})\,|V_z|/(\Omega R)$'),
          ]:
              if old in s:
                  s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          python tools/_apply_flight_sign_fix.py
          rm tools/_apply_flight_sign_fix.py
          python tools/build_toc.py --write
          python tools/field_index.py --write
          git config user.name 'Gustavo Zambrano'
          git config user.email 'gustavozambrano@gmail.com'
          git add zbemt docs tests
          git commit -m 'Fix rotor and propeller flight-angle sign conventions'
          git push origin HEAD:main
