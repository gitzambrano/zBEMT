name: apply inflow global engine patch

on:
  push:
    branches: [inflow-global-models]
    paths:
      - "tools/_apply_inflow_global_patch.py"
      - "tests/regression/test_global_inflow_models.py"
      - ".github/workflows/_apply_inflow_global_patch.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  patch-test-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: inflow-global-models
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply core patch
        run: python tools/_apply_inflow_global_patch.py
      - name: Targeted physics and core regression
        run: |
          python -m pytest -q \
            tests/regression/test_global_inflow_models.py \
            tests/regression/test_bemt.py
      - name: Commit patched engine only after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zbemt/bemt.py
          if git diff --cached --quiet; then
            echo "No engine change to commit"
          else
            git commit -m "feat: correct global inflow models"
            git push origin HEAD:inflow-global-models
          fi
