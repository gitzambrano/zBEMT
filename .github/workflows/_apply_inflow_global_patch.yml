name: apply inflow global engine patch

on:
  push:
    branches: [inflow-global-models]
    paths:
      - "tools/_patch_global_convergence_accept.py"
      - ".github/workflows/_apply_inflow_global_patch.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  patch-test-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: inflow-global-models
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply convergence fix
        run: python tools/_patch_global_convergence_accept.py
      - name: Targeted physics and core regression
        run: |
          python -m pytest -q \
            tests/regression/test_global_inflow_models.py \
            tests/regression/test_bemt.py
      - name: Low-mu convergence spot checks
        run: |
          python - <<'PY'
          import numpy as np
          from zbemt.bemt import Rotor, BEMTConfig, AnalyticalAirfoil, solve_bemt
          r = np.array([0.20, 0.45, 0.70, 1.00])
          rotor = Rotor(R=1.4, Nb=4, Omega_rpm=1000.0,
                        r_root_norm_geom=0.20, r_tip_norm_geom=1.0,
                        r_geom=r, chord_geom=np.full_like(r, 0.20),
                        theta_geom_deg=np.full_like(r, 12.0))
          af = AnalyticalAirfoil(cl_alpha=5.7, cd0=0.016, k=0.0, stall_model="linear")
          worst = 0.0
          for model in ("coleman_global", "coleman_feingold_global", "drees_global"):
              for corrected in (False, True):
                  cfg = BEMTConfig(Ne=36, Npsi=72, inflow_field_model=model,
                                   prandtl_loss_mode="tip" if corrected else "off",
                                   use_compressibility=corrected,
                                   reverse_flow_model="simple_flip", solver="newton",
                                   max_iter=160, tol=1e-7, relax=0.4,
                                   collect_history=False)
                  for mu in (0.04, 0.08, 0.12):
                      maps = solve_bemt(rotor, af, cfg, mu_x=mu, Vz=0.0)
                      res = float(maps["global_inflow_residual"])
                      worst = max(worst, res)
                      assert maps["global_inflow_converged"], (model, corrected, mu, res)
                      assert res <= 1e-6, (model, corrected, mu, res)
          print("worst low-mu residual", worst)
          PY
      - name: Commit patched engine only after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zbemt/bemt.py
          if git diff --cached --quiet; then
            echo "No engine change to commit"
          else
            git commit -m "fix: preserve converged global inflow iterate"
            git push origin HEAD:inflow-global-models
          fi
