name: apply Run Batch fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-run-batch-fix.yml"

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Apply Run Batch fixes and add regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("zbemt/studies.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '    for combo in itertools.product(*(ax["values"] for ax in axes)):\n'
                  '        overrides = dict(zip(variables, combo))',
                  '    # GUI axis rows define loop priority: row 1 varies fastest, row 2\n'
                  '    # wraps row 1, and row 3 is the outermost loop. itertools.product\n'
                  '    # varies its LAST iterable fastest, so iterate reversed axes and\n'
                  '    # reverse each tuple back before mapping it to the original names.\n'
                  '    for reverse_combo in itertools.product(\n'
                  '            *(ax["values"] for ax in reversed(axes))):\n'
                  '        combo = tuple(reversed(reverse_combo))\n'
                  '        overrides = dict(zip(variables, combo))'
              ),
              (
                  'Vz=float(np.tan(np.deg2rad(a)) * Vinf_long)',
                  'Vz=float(-np.tan(np.deg2rad(a)) * Vinf_long)'
              ),
              (
                  'return float(np.tan(np.deg2rad(value)) * Vinf_long)',
                  'return float(-np.tan(np.deg2rad(value)) * Vinf_long)'
              ),
              (
                  'Vz=float(np.tan(np.deg2rad(v)) * Vinf_long)',
                  'Vz=float(-np.tan(np.deg2rad(v)) * Vinf_long)'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Refusing ambiguous patch: expected one occurrence of {old!r}, got {count}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

          cat > tests/regression/test_factorial_generation.py <<'PY'
          """Run Batch factorial ordering and alpha-input regression tests."""
          import unittest
          from unittest.mock import patch

          from zbemt import api, geometry, studies
          from zbemt.models import AirfoilDef, BatchDefinition, Project


          def _project():
              geom = geometry.generate_rectangular(
                  chord_norm=0.08, twist_root_deg=8.0, twist_tip_deg=0.0,
                  radius_m=1.0, n_stations=12)
              return Project(
                  name="factorial-generation",
                  geometry=geom,
                  airfoil=AirfoilDef(source="analytical", stall_model="linear"),
                  config={},
              )


          def _reported_alpha(condition, radius_m=1.0):
              return api.alpha_deg_from_vv(
                  condition.Vz, condition.mu_x, condition.rpm, radius_m)


          class TestFactorialLoopPriority(unittest.TestCase):
              def test_first_row_is_the_inner_loop_for_two_axes(self):
                  conditions = studies.build_factorial_conditions(
                      _project(),
                      [
                          {"variable": "mu_x", "values": [0.1, 0.2, 0.3]},
                          {"variable": "alpha_deg", "values": [-5.0, 0.0, 5.0]},
                      ],
                      {"rpm": 600.0, "collective_deg": 8.0},
                  )

                  actual = [
                      (round(c.mu_x, 6), round(_reported_alpha(c), 6))
                      for c in conditions
                  ]
                  expected = [
                      (0.1, -5.0), (0.2, -5.0), (0.3, -5.0),
                      (0.1, 0.0), (0.2, 0.0), (0.3, 0.0),
                      (0.1, 5.0), (0.2, 5.0), (0.3, 5.0),
                  ]
                  self.assertEqual(actual, expected)

              def test_first_row_inner_second_middle_third_outer(self):
                  conditions = studies.build_factorial_conditions(
                      _project(),
                      [
                          {"variable": "mu_x", "values": [0.1, 0.2]},
                          {"variable": "collective_deg", "values": [4.0, 8.0]},
                          {"variable": "rpm", "values": [400.0, 600.0]},
                      ],
                      {"Vz": 0.0},
                  )

                  actual = [
                      (round(c.mu_x, 6), c.collective_deg, c.rpm)
                      for c in conditions
                  ]
                  expected = [
                      (0.1, 4.0, 400.0), (0.2, 4.0, 400.0),
                      (0.1, 8.0, 400.0), (0.2, 8.0, 400.0),
                      (0.1, 4.0, 600.0), (0.2, 4.0, 600.0),
                      (0.1, 8.0, 600.0), (0.2, 8.0, 600.0),
                  ]
                  self.assertEqual(actual, expected)


          class TestAlphaGenerationConvention(unittest.TestCase):
              def test_fixed_positive_alpha_stays_fixed_across_mu_and_rpm(self):
                  conditions = studies.build_factorial_conditions(
                      _project(),
                      [
                          {"variable": "mu_x", "values": [0.1, 0.2, 0.3]},
                          {"variable": "rpm", "values": [400.0, 800.0]},
                      ],
                      {"alpha_deg": 5.0, "collective_deg": 8.0},
                  )

                  self.assertTrue(all(c.Vz < 0.0 for c in conditions))
                  self.assertEqual(
                      [round(_reported_alpha(c), 9) for c in conditions],
                      [5.0] * len(conditions),
                  )

              def test_direct_alpha_sweep_uses_positive_alpha_as_flow_from_below(self):
                  with patch.object(
                      studies, "_run_conditions",
                      side_effect=lambda _project, conditions, **_kwargs: conditions,
                  ):
                      conditions = studies.run_alpha_sweep(
                          _project(), [-5.0, 5.0], mu_x=0.2,
                          collective_deg=8.0, rpm=600.0)

                  self.assertGreater(conditions[0].Vz, 0.0)
                  self.assertLess(conditions[1].Vz, 0.0)
                  self.assertAlmostEqual(_reported_alpha(conditions[0]), -5.0, places=9)
                  self.assertAlmostEqual(_reported_alpha(conditions[1]), 5.0, places=9)

              def test_legacy_alpha_batch_uses_the_same_sign(self):
                  batch = BatchDefinition(
                      name="alpha",
                      sweep_kind="alpha_sweep",
                      sweep_params={
                          "alpha_deg_values": [-5.0, 5.0],
                          "mu_x": 0.2,
                          "collective_deg": 8.0,
                          "rpm": 600.0,
                      },
                  )
                  with patch.object(
                      studies, "_run_conditions",
                      side_effect=lambda _project, conditions, **_kwargs: conditions,
                  ):
                      conditions = studies.run_batch(_project(), batch)

                  self.assertGreater(conditions[0].Vz, 0.0)
                  self.assertLess(conditions[1].Vz, 0.0)
                  self.assertAlmostEqual(_reported_alpha(conditions[0]), -5.0, places=9)
                  self.assertAlmostEqual(_reported_alpha(conditions[1]), 5.0, places=9)


          if __name__ == "__main__":  # pragma: no cover
              unittest.main()
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Focused regression tests
        run: |
          python -m pytest -q \
            tests/regression/test_factorial_generation.py \
            tests/regression/test_axial_sign_convention.py \
            tests/regression/test_run_batch_queue.py

      - name: Complete test suite
        run: |
          set +e
          python tests/run_all_tests.py
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Full failed-test report"
            cat tests/test_results.txt || true
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Commit tested fix to main and remove this workflow
        run: |
          rm .github/workflows/apply-run-batch-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Run Batch factorial ordering and alpha sign"
          git push origin HEAD:main
