name: apply Run Batch fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-run-batch-fix.yml"

permissions:
  contents: write

concurrency:
  group: apply-run-batch-fix
  cancel-in-progress: true

jobs:
  fix-and-test:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply Run Batch fixes and add regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          studies = Path("zbemt/studies.py")
          text = studies.read_text(encoding="utf-8")
          replacements = [
              (
                  '    for combo in itertools.product(*(ax["values"] for ax in axes)):\n'
                  '        overrides = dict(zip(variables, combo))',
                  '    # GUI axis rows define loop priority: row 1 varies fastest, row 2\n'
                  '    # wraps row 1, and row 3 is the outermost loop. itertools.product\n'
                  '    # varies its LAST iterable fastest, so iterate reversed axes and\n'
                  '    # reverse each tuple back before mapping it to the original names.\n'
                  '    for reverse_combo in itertools.product(\n'
                  '            *(ax["values"] for ax in reversed(axes))):\n'
                  '        combo = tuple(reversed(reverse_combo))\n'
                  '        overrides = dict(zip(variables, combo))'
              ),
              ('Vz=float(np.tan(np.deg2rad(a)) * Vinf_long)',
               'Vz=float(-np.tan(np.deg2rad(a)) * Vinf_long)'),
              ('return float(np.tan(np.deg2rad(value)) * Vinf_long)',
               'return float(-np.tan(np.deg2rad(value)) * Vinf_long)'),
              ('Vz=float(np.tan(np.deg2rad(v)) * Vinf_long)',
               'Vz=float(-np.tan(np.deg2rad(v)) * Vinf_long)'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Refusing ambiguous studies patch: expected one occurrence, got {count}: {old!r}")
              text = text.replace(old, new)
          studies.write_text(text, encoding="utf-8")

          tests = Path("tests/regression/test_axial_sign_convention.py")
          text = tests.read_text(encoding="utf-8")

          old = "import unittest\n\nimport numpy as np"
          new = "import unittest\nfrom unittest.mock import patch\n\nimport numpy as np"
          if text.count(old) != 1:
              raise SystemExit("Unexpected unittest import layout")
          text = text.replace(old, new)

          old = "from zbemt.models import AirfoilDef, FlightCondition, Project"
          new = "from zbemt.models import AirfoilDef, BatchDefinition, FlightCondition, Project"
          if text.count(old) != 1:
              raise SystemExit("Unexpected models import layout")
          text = text.replace(old, new)

          marker = '\n\nif __name__ == "__main__":   # pragma: no cover\n    unittest.main()\n'
          if text.count(marker) != 1:
              raise SystemExit("Could not locate unittest main marker")

          regression = dedent(r'''

          def _generated_alpha(condition):
              return api.alpha_deg_from_vv(
                  condition.Vz, condition.mu_x, condition.rpm, 1.0)


          class TestFactorialLoopPriority(unittest.TestCase):
              """The first visible Run Batch axis is the innermost loop."""

              def test_first_row_is_the_inner_loop_for_two_axes(self):
                  conditions = studies.build_factorial_conditions(
                      _project(),
                      [
                          {"variable": "mu_x", "values": [0.1, 0.2, 0.3]},
                          {"variable": "alpha_deg", "values": [-5.0, 0.0, 5.0]},
                      ],
                      {"rpm": 600.0, "collective_deg": 8.0},
                  )
                  actual = [
                      (round(c.mu_x, 6), round(_generated_alpha(c), 6))
                      for c in conditions
                  ]
                  self.assertEqual(actual, [
                      (0.1, -5.0), (0.2, -5.0), (0.3, -5.0),
                      (0.1, 0.0), (0.2, 0.0), (0.3, 0.0),
                      (0.1, 5.0), (0.2, 5.0), (0.3, 5.0),
                  ])

              def test_first_row_inner_second_middle_third_outer(self):
                  conditions = studies.build_factorial_conditions(
                      _project(),
                      [
                          {"variable": "mu_x", "values": [0.1, 0.2]},
                          {"variable": "collective_deg", "values": [4.0, 8.0]},
                          {"variable": "rpm", "values": [400.0, 600.0]},
                      ],
                      {"Vz": 0.0},
                  )
                  actual = [(round(c.mu_x, 6), c.collective_deg, c.rpm)
                            for c in conditions]
                  self.assertEqual(actual, [
                      (0.1, 4.0, 400.0), (0.2, 4.0, 400.0),
                      (0.1, 8.0, 400.0), (0.2, 8.0, 400.0),
                      (0.1, 4.0, 600.0), (0.2, 4.0, 600.0),
                      (0.1, 8.0, 600.0), (0.2, 8.0, 600.0),
                  ])


          class TestBatchAlphaGenerationConvention(unittest.TestCase):
              """Every batch path uses alpha_rotor > 0 => Vz < 0."""

              def test_fixed_positive_alpha_stays_fixed_across_mu_and_rpm(self):
                  conditions = studies.build_factorial_conditions(
                      _project(),
                      [
                          {"variable": "mu_x", "values": [0.1, 0.2, 0.3]},
                          {"variable": "rpm", "values": [400.0, 800.0]},
                      ],
                      {"alpha_deg": 5.0, "collective_deg": 8.0},
                  )
                  self.assertTrue(all(c.Vz < 0.0 for c in conditions))
                  self.assertEqual(
                      [round(_generated_alpha(c), 9) for c in conditions],
                      [5.0] * len(conditions))

              def test_direct_alpha_sweep_uses_positive_alpha_as_flow_from_below(self):
                  with patch.object(
                          studies, "_run_conditions",
                          side_effect=lambda _project, conditions, **_kwargs: conditions):
                      conditions = studies.run_alpha_sweep(
                          _project(), [-5.0, 5.0], mu_x=0.2,
                          collective_deg=8.0, rpm=600.0)
                  self.assertGreater(conditions[0].Vz, 0.0)
                  self.assertLess(conditions[1].Vz, 0.0)
                  self.assertAlmostEqual(_generated_alpha(conditions[0]), -5.0, places=9)
                  self.assertAlmostEqual(_generated_alpha(conditions[1]), 5.0, places=9)

              def test_legacy_alpha_batch_uses_the_same_sign(self):
                  batch = BatchDefinition(
                      name="alpha", sweep_kind="alpha_sweep",
                      sweep_params={
                          "alpha_deg_values": [-5.0, 5.0],
                          "mu_x": 0.2, "collective_deg": 8.0, "rpm": 600.0,
                      },
                  )
                  with patch.object(
                          studies, "_run_conditions",
                          side_effect=lambda _project, conditions, **_kwargs: conditions):
                      conditions = studies.run_batch(_project(), batch)
                  self.assertGreater(conditions[0].Vz, 0.0)
                  self.assertLess(conditions[1].Vz, 0.0)
                  self.assertAlmostEqual(_generated_alpha(conditions[0]), -5.0, places=9)
                  self.assertAlmostEqual(_generated_alpha(conditions[1]), 5.0, places=9)
          ''')
          text = text.replace(marker, regression + marker)
          tests.write_text(text, encoding="utf-8")
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Focused regression tests
        run: python -m pytest -q tests/regression/test_axial_sign_convention.py

      - name: Commit tested fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zbemt/studies.py tests/regression/test_axial_sign_convention.py
          git commit -m "Fix Run Batch factorial ordering and alpha sign"
          git push origin HEAD:main
