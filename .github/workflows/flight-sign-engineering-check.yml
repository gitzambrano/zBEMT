name: Flight sign engineering check

on:
  push:
    branches:
      - fix/unify-alpha-vz-sign-convention
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign-convention:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-alpha-vz-sign-convention
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply convention patch
        run: python tools/apply_flight_sign_fix.py

      - name: Refresh generated documentation indexes
        run: |
          python tools/build_toc.py --write
          python tools/field_index.py --write

      - name: Commit generated patch to branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: unify flight angle and Vz signs"
            git push origin HEAD:fix/unify-alpha-vz-sign-convention
          fi

      - name: Install zBEMT with GUI dependencies
        run: python -m pip install -e ".[all]"

      - name: Focused convention tests
        run: |
          python -m pytest tests/regression/test_axial_sign_convention.py -q
          python -m pytest tests/regression/test_propeller_axes_convention.py -q
          python -m pytest tests/regression/test_condition_units.py -q
          python -m pytest tests/regression/test_run_tabs.py -q

      - name: Engineer GUI API and bemt paths
        run: python tools/flight_sign_engineering_check.py

      - name: Audit sign language in docs and help
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              'docs/documentation.html': [
                  r'\\alpha_{rotor}=-\\operatorname{atan2}(V_z,V_x)',
                  r'\\mu_x=-\\tan(\\alpha_{disk})\\,|V_z|/(\\Omega R)',
                  'Positive when the flow arrives from below',
              ],
              'docs/software_requirements.md': [
                  'alpha_disk = atan2(-V_z, |V_x|)',
                  'free stream arrives from above',
              ],
              'zbemt/gui/widgets.py': [
                  'Positive α<sub>disk</sub> means the free stream arrives from BELOW',
                  'Positive V<sub>z</sub> means the free stream arrives from ABOVE',
              ],
          }
          for name, needles in checks.items():
              text = Path(name).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, f'{name}: missing {needle}'
                  print('PASS ', name, needle)
          PY

      - name: Complete test suite
        run: python tests/run_all_tests.py

      - name: Upload engineering GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-sign-engineering-evidence
          path: |
            rotor_sign_gui.png
            propeller_sign_gui.png
            propeller_sign_batch_gui.png
          if-no-files-found: ignore
