name: align global inflow docs and Glauert semantics

on:
  push:
    branches: [inflow-global-models]
    paths:
      - '.github/workflows/_patch_global_docs_glauert.yml'

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: inflow-global-models
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'
      - name: Apply alignment patch
        run: python tools/_patch_global_docs_glauert.py
      - name: Targeted physics, migration, GUI and help tests
        run: |
          python -m pytest -q \
            tests/regression/test_global_inflow_models.py \
            tests/regression/test_option_discoverability.py \
            tests/architecture/test_help_content.py \
            tests/architecture/test_help_registry.py \
            tests/architecture/test_documentation.py \
            tests/architecture/test_user_facing_documentation.py
      - name: Documentation semantic assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          doc = Path('docs/documentation.html').read_text(encoding='utf-8')
          popup = Path('zbemt/gui/help_blocks.py').read_text(encoding='utf-8')
          field = Path('zbemt/gui/help_content.py').read_text(encoding='utf-8')
          gui = Path('zbemt/gui/tabs/config.py').read_text(encoding='utf-8')
          engine = Path('zbemt/bemt.py').read_text(encoding='utf-8')
          studies = Path('zbemt/studies.py').read_text(encoding='utf-8')
          required_doc = [
              'Coleman-Feingold global',
              'Local and Global empirical wake formulations',
              'glauert_global',
              'coleman_feingold_global',
              'drees_global',
              'disk-wide wake condition',
          ]
          for s in required_doc:
              assert s in doc, s
          assert 'superseded names ending in <code>_global</code>' not in doc
          assert 'Glauert.</b> K<sub>x</sub>=K<sub>y</sub>=0. It is the axisymmetric' in popup
          assert '"glauert_global":' not in field
          assert '"glauert": ("local",)' in gui
          assert '"glauert_global":       dict' not in engine
          assert 'migrated["inflow_field_model"] == "glauert_global"' in studies
          print('documentation and popup semantics aligned')
          PY
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            zbemt/bemt.py \
            zbemt/studies.py \
            zbemt/gui/tabs/config.py \
            zbemt/gui/help_content.py \
            zbemt/gui/help_blocks.py \
            docs/documentation.html \
            tests/regression/test_global_inflow_models.py \
            tests/regression/test_option_discoverability.py
          git commit -m 'docs: align global inflow models and Glauert semantics'
          git push origin HEAD:inflow-global-models
