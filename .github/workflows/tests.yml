name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-py310-plot-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Apply log-axis clipping fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("zbemt/viz/plots.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '            ax_res.tick_params(axis="y", labelcolor="tab:red", labelsize=8)\n'
              '            lines = (ax_hist.get_lines() if hist else []) + ax_res.get_lines()\n'
          )
          new = (
              '            ax_res.tick_params(axis="y", labelcolor="tab:red", labelsize=8)\n'
              '            # LogLocator creates major ticks outside the visible limits.\n'
              '            # Their labels are not clipped by the axes, so keep only full\n'
              '            # decades that are actually inside the displayed residual range.\n'
              '            y_min, y_max = ax_res.get_ylim()\n'
              '            if np.isfinite(y_min) and np.isfinite(y_max) and y_min > 0.0 and y_max > 0.0:\n'
              '                first_decade = int(np.ceil(np.log10(y_min)))\n'
              '                last_decade = int(np.floor(np.log10(y_max)))\n'
              '                if first_decade <= last_decade:\n'
              '                    ax_res.set_yticks(10.0 ** np.arange(first_decade, last_decade + 1))\n'
              '            lines = (ax_hist.get_lines() if hist else []) + ax_res.get_lines()\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one convergence residual-axis block, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify and commit
        run: |
          if python -m pytest tests/regression/test_flapping.py tests/regression/test_plots.py -q --tb=long; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add zbemt/viz/plots.py
            git diff --cached --check
            git commit -m 'fix: keep convergence log ticks inside the figure' || exit 0
            git push origin HEAD:main
          else
            echo "Focused verification failed; main was not modified."
            exit 0
          fi
