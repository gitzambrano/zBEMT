name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  flapping-stability-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - name: Install with every extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Measure repeated flapping convergence
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          echo '=== forward convergence: 12 fresh pytest processes ==='
          for i in $(seq 1 12); do
            echo "--- forward run $i ---"
            python -m pytest \
              tests/regression/test_flapping.py::TestForwardFlapConvergence::test_reference_rotor_converges_at_moderate_advance_ratio \
              -vv --tb=long
            echo "exit=$?"
          done
          echo '=== pitch-rate closed form: 12 fresh pytest processes ==='
          for i in $(seq 1 12); do
            echo "--- pitch run $i ---"
            python -m pytest \
              tests/regression/test_flapping.py::TestTheHubRateForcingMatchesItsClosedForm::test_the_pitch_rate_response_matches_the_closed_form \
              -vv --tb=long
            echo "exit=$?"
          done
          exit 0
