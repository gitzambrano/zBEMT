name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The engine and the CLI do not depend on Qt -- deliberately, so that a
  # batch on a headless server does not need it. This job proves that: it
  # installs ONLY the base dependencies and runs everything that is not GUI.
  # If someone slips an `import PyQt6` into the engine, this breaks here.
  engine:
    name: engine + CLI (no Qt), Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install (base dependencies only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm that PyQt6 is NOT installed
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("PyQt6") is not None:
              sys.exit("PyQt6 was installed in this job. The job exists to "
                       "prove that the engine runs without Qt, so some "
                       "dependency has pulled it in.")
          print("ok: no PyQt6, as expected")
          PY

      - name: Tests (the GUI ones skip themselves without Qt; one process per file)
        run: |
          set +e
          python tests/run_all_tests.py
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Full failed-test report"
            cat tests/test_results.txt || true
            echo "::endgroup::"
            exit "$status"
          fi

  gui:
    name: complete suite with the GUI (headless)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyQt6 needs these system libraries even in offscreen mode
      - name: Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install with every extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Complete suite (one process per file)
        # QT_QPA_PLATFORM is also set in tests/conftest.py; repeated here
        # for anyone running the job without going through conftest.
        # One process per file (tests/run_all_tests.py) avoids the native
        # crash (segfault/access violation) seen when many GUI test files
        # accumulate Qt/matplotlib canvases in a single pytest process --
        # see the module docstring.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_all_tests.py

  installation:
    name: clean installation (wheel, outside the repository)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install dist/*.whl

      # Runs OUTSIDE the repository: this is how you catch a path that only
      # worked by accident, because it sat next to the source code
      # (the bug that `zbemt/paths.py` exists to avoid).
      - name: Import and run the CLI from outside the repository
        run: |
          cd /tmp
          python -c "import zbemt; print('version', zbemt.__version__)"
          zbemt --help > /dev/null
          python - <<'PY'
          import re
          from zbemt import paths
          root = paths.projects_root()
          assert "site-packages" not in str(root), \
              f"projects_root fell inside the installation: {root}"
          print("ok: projects_root =", root)

          # The embedded help (button "?" / F1) has to ship inside the
          # wheel, and COMPLETE: without the figures and KaTeX it opens
          # broken, with the equations as raw LaTeX. See setup.py.
          doc = paths.documentation_path()
          assert doc is not None and doc.is_file(), \
              "documentation.html was not packaged: F1 would not work"
          html = doc.read_text(encoding="utf-8")
          refs = set(re.findall(r'src="((?:img|vendor)/[^"]+)"', html))
          missing = [r for r in refs if not (doc.parent / r).exists()]
          assert not missing, f"help resources missing from the wheel: {missing}"
          assert not re.findall(r'src="https?', html), \
              "the embedded help loads an external resource: it would not open offline"
          print(f"ok: embedded help with {len(refs)} resources, all local")
          PY
