name: Pitt-Peters periodic product gate

# Qt offscreen still instantiates/shows/resizes/grabs the real widgets, without runner-specific XCB dependencies.
on:
  push:
    branches: [inflow-global-models]
    paths:
      - '.github/workflows/_pitt_periodic_product_gate.yml'

permissions:
  contents: write

jobs:
  product-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: inflow-global-models
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply final product patch
        run: python tools/_patch_pitt_periodic_finish.py
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            zbemt/bemt.py zbemt/studies.py zbemt/validation.py zbemt/cli.py \
            zbemt/gui/tabs/config.py zbemt/gui/help_content.py zbemt/gui/help_blocks.py
      - name: Install GUI and test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
          python -m pip install -e '.[dev,gui]'
      - name: Targeted physics, validation and documentation tests
        run: |
          python -m pytest -q \
            tests/regression/test_pitt_peters_periodic_case.py \
            tests/regression/test_pitt_peters_inflow.py \
            tests/regression/test_dynamic_stall_methods.py \
            tests/regression/test_validation.py \
            tests/architecture/test_help_content.py \
            tests/architecture/test_help_registry.py \
            tests/architecture/test_documentation.py \
            tests/architecture/test_user_facing_documentation.py
      - name: CLI help and end-to-end dynamic fixed case
        run: |
          python -m zbemt.cli --help | grep -F -- '--pitt-peters-time-march-revolutions'
          python -m zbemt.cli --help | grep -F -- '--pitt-peters-time-march-avg-last'
          python -m zbemt.cli --help | grep -F -- '--pitt-peters-time-march-substeps-per-revolution'
          python -m zbemt.cli --help | grep -F -- '--pitt-peters-time-march-initial-state'
          rm -rf /tmp/zbemt-cli-out
          python -m zbemt.cli \
            --project projects/starter_rotor \
            --rpm 400 --mu-inplane 0.10 --collective 8 \
            --inflow pitt_peters_unsteady \
            --pitt-peters-time-march-revolutions 8 \
            --pitt-peters-time-march-avg-last 3 \
            --pitt-peters-time-march-substeps-per-revolution 16 \
            --pitt-peters-time-march-initial-state equilibrium \
            --outdir /tmp/zbemt-cli-out --plots --no-csv
      - name: Multi-size full-GUI interaction and clipping audit
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/_audit_pitt_periodic_gui.py
      - name: Upload GUI screenshots and audit report
        uses: actions/upload-artifact@v4
        with:
          name: pitt-periodic-gui-audit
          path: gui-audit/
          if-no-files-found: error
      - name: Full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_all_tests.py
      - name: Commit tested product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            zbemt/bemt.py zbemt/studies.py zbemt/validation.py zbemt/cli.py \
            zbemt/gui/tabs/config.py zbemt/gui/help_content.py zbemt/gui/help_blocks.py \
            docs/documentation.html \
            tests/regression/test_pitt_peters_periodic_case.py \
            tests/regression/test_validation.py tests/suite_manifest.json
          git commit -m 'feat: time-march Pitt-Peters in fixed cases'
          git push origin HEAD:inflow-global-models
