name: GUI visual previews

on:
  push:
    branches: [gui-responsive-hardening]

permissions:
  contents: write

jobs:
  previews:
    if: ${{ !contains(github.event.head_commit.message, '[visual-small]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-responsive-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build compact contact sheets
        run: |
          pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageEnhance
          root=Path('visual-artifacts'); out=root/'review-small'; out.mkdir(parents=True,exist_ok=True)
          font=ImageFont.load_default()
          def sheet(items,target,cell=(320,190),quality=10):
              cols=2; rows=(len(items)+1)//2
              c=Image.new('RGB',(cell[0]*cols,cell[1]*rows),'white'); d=ImageDraw.Draw(c)
              for i,(label,path) in enumerate(items):
                  im=Image.open(path).convert('RGB'); im.thumbnail((cell[0]-8,cell[1]-24),Image.Resampling.LANCZOS)
                  x=(i%2)*cell[0]+(cell[0]-im.width)//2; y=(i//2)*cell[1]+18+(cell[1]-24-im.height)//2
                  c.paste(im,(x,y)); d.text(((i%2)*cell[0]+4,(i//2)*cell[1]+3),label,fill='black',font=font)
              c.save(target,'JPEG',quality=quality,optimize=True,progressive=True)
          p=root/'plots'
          sheet([('FULL coefficients',p/'full-coefficients.png'),('small coefficients',p/'host-coefficients-700x420.png'),
                 ('FULL convergence',p/'full-convergence.png'),('small convergence',p/'host-convergence-700x420.png'),
                 ('FULL disk 4x4',p/'full-disk-grid-4x4.png'),('small disk 4x4',p/'host-disk-grid-4x4-700x420.png'),
                 ('FULL dense XY',p/'full-dense-xy-30-series.png'),('small dense XY',p/'host-dense-xy-30-series-700x420.png')],
                out/'plots.jpg',cell=(320,190),quality=10)
          for spec in ('1100x650','1366x700','1536x796'):
              u=root/'ui'/spec
              sheet([(f'{spec} airfoil',u/'airfoil.png'),(f'{spec} results',u/'results.png'),
                     (f'{spec} designer',u/'designer.png'),(f'{spec} run batch',u/'run-batch.png'),
                     (f'{spec} transient',u/'transient.png'),(f'{spec} geometry',u/'geometry.png')],
                    out/f'ui-{spec}.jpg',cell=(320,180),quality=10)
          for x in sorted(out.glob('*.jpg')): print(x,x.stat().st_size)
          PY
      - name: Commit review sheets
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add visual-artifacts/review-small
          git commit -m "[visual-small] Add compact visual review sheets"
          git push origin HEAD:gui-responsive-hardening
