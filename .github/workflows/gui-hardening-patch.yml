name: GUI visual review artifact

on:
  push:
    branches: [gui-responsive-hardening]

jobs:
  review-artifact:
    if: ${{ !contains(github.event.head_commit.message, '[review-artifact]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-responsive-hardening
      - uses: actions/upload-artifact@v4
        with:
          name: gui-visual-review
          path: |
            visual-artifacts/review-small/*.jpg
            visual-artifacts/previews/*.jpg
            visual-artifacts/plots/manifest.json
          if-no-files-found: error
          retention-days: 1
