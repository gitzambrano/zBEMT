name: GUI visual previews

on:
  push:
    branches: [gui-responsive-hardening]

permissions:
  contents: write

jobs:
  previews:
    if: ${{ !contains(github.event.head_commit.message, '[visual-previews]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-responsive-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build compact contact sheets
        run: |
          pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path('visual-artifacts')
          out = root / 'previews'
          out.mkdir(parents=True, exist_ok=True)
          font = ImageFont.load_default()

          def sheet(items, target, cols=2, cell=(430, 280), quality=18):
              rows = (len(items) + cols - 1) // cols
              canvas = Image.new('RGB', (cell[0]*cols, cell[1]*rows), 'white')
              draw = ImageDraw.Draw(canvas)
              for i, (label, path) in enumerate(items):
                  im = Image.open(path).convert('RGB')
                  maxw, maxh = cell[0]-12, cell[1]-28
                  im.thumbnail((maxw, maxh), Image.Resampling.LANCZOS)
                  x = (i % cols)*cell[0] + (cell[0]-im.width)//2
                  y = (i // cols)*cell[1] + 20 + (maxh-im.height)//2
                  canvas.paste(im, (x, y))
                  draw.text(((i % cols)*cell[0]+6, (i // cols)*cell[1]+5), label, fill='black', font=font)
              canvas.save(target, 'JPEG', quality=quality, optimize=True, progressive=True)

          p = root/'plots'
          sheet([
              ('FULL coefficients', p/'full-coefficients.png'),
              ('700x420 coefficients + scroll', p/'host-coefficients-700x420.png'),
              ('FULL convergence', p/'full-convergence.png'),
              ('700x420 convergence + scroll', p/'host-convergence-700x420.png'),
              ('FULL disk grid 4x4', p/'full-disk-grid-4x4.png'),
              ('700x420 disk grid + scroll', p/'host-disk-grid-4x4-700x420.png'),
              ('FULL dense XY 30 series', p/'full-dense-xy-30-series.png'),
              ('700x420 dense XY + scroll', p/'host-dense-xy-30-series-700x420.png'),
          ], out/'plots.jpg', cols=2, cell=(430,280), quality=18)

          for spec in ('1100x650','1366x700','1536x796'):
              u = root/'ui'/spec
              sheet([
                  (f'{spec} airfoil', u/'airfoil.png'),
                  (f'{spec} results', u/'results.png'),
                  (f'{spec} designer', u/'designer.png'),
                  (f'{spec} run batch', u/'run-batch.png'),
                  (f'{spec} transient', u/'transient.png'),
                  (f'{spec} geometry', u/'geometry.png'),
              ], out/f'ui-{spec}.jpg', cols=2, cell=(430,260), quality=18)

          for path in sorted(out.glob('*.jpg')):
              print(path, path.stat().st_size)
          PY
      - name: Commit previews
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add visual-artifacts/previews
          git commit -m "[visual-previews] Add compact visual review sheets"
          git push origin HEAD:gui-responsive-hardening
