name: GUI hardening patch

on:
  push:
    branches: [gui-responsive-hardening]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-responsive-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - name: Apply deterministic hardening patch
        run: |
          sed -i 's#zbemt/gui/tools/geometry_designer.py#zbemt/gui/tabs/designer_window.py#g' tools/apply_gui_responsive_hardening.py
          python tools/apply_gui_responsive_hardening.py
          python - <<'PY'
          from pathlib import Path

          plots = Path('zbemt/viz/plots.py')
          text = plots.read_text(encoding='utf-8')
          old = '''def _finish(ax, fig, fname):\n    if fname is not None and fig is not None:\n        fig.tight_layout()\n        fig.savefig(fname, dpi=_EXPORT_DPI)\n    return ax\n'''
          new = '''def _finish(ax, fig, fname):\n    if fname is not None and fig is not None:\n        # Preserve a draw-time layout engine (especially constrained layout).\n        # Switching back to one-shot tight_layout at export time can move\n        # artists again and defeats the same resize protection used in GUI.\n        if fig.get_layout_engine() is None:\n            fig.tight_layout()\n        fig.savefig(fname, dpi=_EXPORT_DPI)\n    return ax\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          old = '    fig, ax = _resolve_ax(ax, fname, figsize=(6.4, 4))\n    n_rev = history.shape[0]\n'
          new = '    ax, fig = _resolve_ax(ax, fname, figsize=(6.4, 4))\n    n_rev = history.shape[0]\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          plots.write_text(text, encoding='utf-8')

          quality = Path('tests/architecture/test_quality_orchestrator.py')
          text = quality.read_text(encoding='utf-8')
          old = '''        self.assertEqual(displayed, expected)\n        self.assertIn(r'\"C:\\Quality Checks\\run.py\"', displayed)\n'''
          new = '''        self.assertEqual(displayed, expected)\n        # Windows list2cmdline uses double quotes; POSIX shlex.join uses\n        # single quotes. The old assertion required Windows quoting even\n        # on Linux CI, contradicting the expected value above.\n        quoted_path = (r'\"C:\\Quality Checks\\run.py\"' if os.name == \"nt\"\n                       else r\"'C:\\Quality Checks\\run.py'\")\n        self.assertIn(quoted_path, displayed)\n'''
          assert text.count(old) == 1, text.count(old)
          quality.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Baseline failures first
        run: |
          python tests/run_all_tests.py --suite architecture -k documentation || { cat tests/test_results.txt; exit 1; }
          python tests/run_all_tests.py --suite architecture -k quality_orchestrator || { cat tests/test_results.txt; exit 1; }
          python tests/run_all_tests.py --suite regression -k flapping || { cat tests/test_results.txt; exit 1; }
      - name: Responsive GUI and plot regressions
        run: |
          python tests/run_all_tests.py --suite regression -k plot_scaling || { cat tests/test_results.txt; exit 1; }
          python tests/run_all_tests.py --suite regression -k plots.py || { cat tests/test_results.txt; exit 1; }
          python tests/run_all_tests.py --suite regression -k small_screen || { cat tests/test_results.txt; exit 1; }
          python tests/run_all_tests.py --suite regression -k gui_layout || { cat tests/test_results.txt; exit 1; }
          python tests/run_all_tests.py --suite regression -k tools_window_layout || { cat tests/test_results.txt; exit 1; }
          python tests/run_all_tests.py --suite regression -k designer_window || { cat tests/test_results.txt; exit 1; }
      - name: Commit patch when tests pass
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add zbemt/viz/plots.py \
                  zbemt/gui/tabs/designer_window.py \
                  tests/regression/test_plots.py \
                  tests/regression/test_plot_scaling.py \
                  tests/architecture/test_quality_orchestrator.py \
                  tools/gui_screenshots.py \
                  .github/workflows/tests.yml
          git commit -m "Harden GUI plots for small screens"
          git push origin HEAD:gui-responsive-hardening
