name: diagnose global inflow closure

on:
  push:
    branches: [inflow-global-models]
    paths: [".github/workflows/_diagnose_global_closure.yml"]
  workflow_dispatch:

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Current 120-iteration cap
        run: |
          python - <<'PY'
          import math, numpy as np
          from zbemt.bemt import Rotor, BEMTConfig, AnalyticalAirfoil, solve_bemt
          r=np.array([0.20,0.45,0.70,1.00])
          rotor=Rotor(R=1.4,Nb=4,Omega_rpm=1000.0,r_root_norm_geom=.20,r_tip_norm_geom=1.0,
                      r_geom=r,chord_geom=np.full_like(r,.20),theta_geom_deg=np.full_like(r,12.0))
          af=AnalyticalAirfoil(cl_alpha=5.7,cd0=.016,k=0.0,stall_model="linear")
          mu=.44; alpha=10.0; lz=-mu*math.tan(math.radians(alpha))
          cfg=BEMTConfig(Ne=36,Npsi=72,inflow_field_model="coleman_feingold_global",
                         prandtl_loss_mode="off",use_compressibility=False,
                         reverse_flow_model="simple_flip",solver="newton",max_iter=160,tol=1e-7,
                         relax=.4,collect_history=False)
          m=solve_bemt(rotor,af,cfg,mu_x=mu,Vz=lz*rotor.OmegaR)
          h=m["global_inflow_residual_history"]
          print("current iterations",m["global_inflow_iterations"],"res",m["global_inflow_residual"],"converged",m["global_inflow_converged"])
          print("history tail",h[-20:])
          PY
      - name: Remove artificial 120-iteration cap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("zbemt/bemt.py")
          s=p.read_text()
          old="max_outer = max(10, min(int(cfg.max_iter), 120))"
          new="max_outer = max(10, int(cfg.max_iter))"
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
      - name: Recheck with configured iteration budgets
        run: |
          for budget in 160 200 300 500; do
            BUDGET=$budget python - <<'PY'
          import math, os, numpy as np
          from zbemt.bemt import Rotor, BEMTConfig, AnalyticalAirfoil, solve_bemt
          r=np.array([0.20,0.45,0.70,1.00])
          rotor=Rotor(R=1.4,Nb=4,Omega_rpm=1000.0,r_root_norm_geom=.20,r_tip_norm_geom=1.0,
                      r_geom=r,chord_geom=np.full_like(r,.20),theta_geom_deg=np.full_like(r,12.0))
          af=AnalyticalAirfoil(cl_alpha=5.7,cd0=.016,k=0.0,stall_model="linear")
          mu=.44; alpha=10.0; lz=-mu*math.tan(math.radians(alpha)); budget=int(os.environ["BUDGET"])
          cfg=BEMTConfig(Ne=36,Npsi=72,inflow_field_model="coleman_feingold_global",
                         prandtl_loss_mode="off",use_compressibility=False,
                         reverse_flow_model="simple_flip",solver="newton",max_iter=budget,tol=1e-7,
                         relax=.4,collect_history=False)
          m=solve_bemt(rotor,af,cfg,mu_x=mu,Vz=lz*rotor.OmegaR)
          h=m["global_inflow_residual_history"]
          print("budget",budget,"iterations",m["global_inflow_iterations"],"res",m["global_inflow_residual"],"converged",m["global_inflow_converged"],"tail",h[-8:])
          PY
          done
