name: flap-convergence-tuning

on:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Probe inner solver stability
        run: |
          python - <<'PY'
          import os
          from zbemt import api, studies
          from zbemt.models import BladeDynamicsDef, FlightCondition

          repo = os.getcwd()
          cases = (
              ("baseline", {}),
              ("all_inner", {"early_exit_fraction": 1.0, "stagnation_min_frac": 1.0}),
              ("almost_all", {"early_exit_fraction": 0.9999, "stagnation_min_frac": 1.0}),
          )
          for label, overrides in cases:
              for mu in (0.20, 0.25):
                  project = api.open_project(os.path.join(repo, "projects", "starter_rotor"))
                  project.geometry.dynamics = BladeDynamicsDef(
                      flap_model="offset", hinge_offset_norm=0.05,
                      inertia_source="lock", lock_number=8.0, harmonics=2,
                      outer_tol_deg=1e-4, outer_max_iter=40, outer_relax=0.5,
                  )
                  project.config.update(Ne=32, Npsi=48, solver="newton", max_iter=300,
                                        **overrides)
                  result = studies.run_single_case(
                      project,
                      FlightCondition(name="probe", mu_x=mu,
                                      collective_deg=10.0, rpm=600.0),
                  )
                  s = result.summary
                  hist = result.maps.get("flap_outer_history", [])
                  frac = result.maps.get("frac_converged_history", [])
                  resid = result.maps.get("residual_history", [])
                  print(label, "mu=", mu,
                        "outer=", s["flap_outer_converged"],
                        "outer_res=", s["flap_outer_residual_deg"],
                        "outer_it=", s["flap_outer_iterations"],
                        "outer_tail=", hist[-8:],
                        "inner_frac_tail=", frac[-5:] if frac else [],
                        "inner_res_tail=", resid[-5:] if resid else [])
          PY
