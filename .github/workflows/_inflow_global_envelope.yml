name: inflow global models envelope validation

# Final feature-branch envelope gate; remove this temporary workflow before merge.
on:
  push:
    branches: [inflow-global-models]
    paths:
      - ".github/workflows/_inflow_global_envelope.yml"
  workflow_dispatch:

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  envelope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Sweep mu, alpha and correction sets
        run: |
          python - <<'PY'
          import math
          import numpy as np
          from zbemt.bemt import Rotor, BEMTConfig, AnalyticalAirfoil, solve_bemt, aggregate_results

          r = np.array([0.20, 0.45, 0.70, 1.00])
          rotor = Rotor(
              R=1.4, Nb=4, Omega_rpm=1000.0,
              r_root_norm_geom=0.20, r_tip_norm_geom=1.0,
              r_geom=r, chord_geom=np.full_like(r, 0.20),
              theta_geom_deg=np.full_like(r, 12.0),
          )
          airfoil = AnalyticalAirfoil(cl_alpha=5.7, cd0=0.016, k=0.0,
                                      stall_model="linear")
          models = ("coleman_global", "coleman_feingold_global", "drees_global")
          mus = np.round(np.arange(0.0, 0.5000001, 0.04), 10)
          alphas = (-10.0, 0.0, 10.0)
          correction_sets = (
              ("clean", False, "off"),
              ("mach_tip", True, "tip"),
          )
          required = ("CT", "CQ", "CH", "CMx", "CMy", "lambda_i")
          rows = []
          failures = []

          for model in models:
              for corr_name, compressibility, prandtl in correction_sets:
                  cfg = BEMTConfig(
                      Ne=36, Npsi=72,
                      inflow_field_model=model,
                      prandtl_loss_mode=prandtl,
                      use_compressibility=compressibility,
                      reverse_flow_model="simple_flip",
                      use_rotational_augmentation=False,
                      use_radial_flow_correction=False,
                      use_dynamic_stall=False,
                      solver="newton", max_iter=160, tol=1e-7,
                      relax=0.4, collect_history=False,
                  )
                  for alpha in alphas:
                      for mu in mus:
                          lambda_z = -float(mu) * math.tan(math.radians(alpha))
                          Vz = lambda_z * rotor.OmegaR
                          maps = solve_bemt(rotor, airfoil, cfg, mu_x=float(mu), Vz=Vz)
                          summary = aggregate_results(rotor, cfg, maps)
                          residual = float(maps.get("global_inflow_residual", math.nan))
                          converged = bool(maps.get("global_inflow_converged", False))
                          finite = all(math.isfinite(float(summary[k])) for k in required)
                          rows.append((model, corr_name, alpha, mu, converged, residual,
                                       float(summary["CT"]), float(summary["CQ"])))
                          if (not converged) or (not finite) or (not math.isfinite(residual)) or residual > 1e-6:
                              failures.append(rows[-1])

          print(f"cases={len(rows)} failures={len(failures)}")
          for model in models:
              subset = [x for x in rows if x[0] == model]
              print(
                  model,
                  "max_residual=", max(x[5] for x in subset),
                  "CT_range=", (min(x[6] for x in subset), max(x[6] for x in subset)),
                  "CQ_range=", (min(x[7] for x in subset), max(x[7] for x in subset)),
              )
          if failures:
              print("FAILURES (first 30):")
              for row in failures[:30]:
                  print(row)
              raise SystemExit(1)
          PY
