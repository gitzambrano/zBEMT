name: documentation user audit

on:
  push:
    branches: [documentation-user-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: documentation-user-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Apply documentation audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/_apply_documentation_user_audit_extra.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)',
              'out, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)',
          )
          text = text.replace(
              r"r'<p>Given a trial field \$\\lambda_i\$, the function executes, vectorized over the entire \$N_e\\times N_\\psi\$ mesh,\s*the following sequence:</p>'",
              r"r'<p>Given a trial field \$\\lambda_i\$, the function executes, vectorized over the entire mesh\s*\$\(N_e,N_\\psi\)\$:</p>'",
          )
          p.write_text(text, encoding='utf-8')
          PY
          python tools/_apply_documentation_user_audit.py
          python tools/_apply_documentation_user_audit_extra.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'

      - name: Run documentation and help architecture tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tests.run_all_tests import _run_one

          root = Path.cwd()
          env = os.environ.copy()
          env.setdefault("QT_QPA_PLATFORM", "offscreen")
          files = [
              root / "tests/architecture/test_documentation.py",
              root / "tests/architecture/test_help_content.py",
              root / "tests/architecture/test_every_field_has_a_popup.py",
              root / "tests/architecture/test_user_facing_documentation.py",
          ]
          failed = []
          for path in files:
              ok, summary, output = _run_one(path, env)
              print(f"{path.name}: {summary}")
              if not ok:
                  failed.append(path.name)
                  print(output)
          if failed:
              raise SystemExit("Failed: " + ", ".join(failed))
          PY

      - name: Commit audited documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/documentation.html docs/software_requirements.md zbemt/gui/help_content.py zbemt/gui/help_blocks.py tests/architecture/test_user_facing_documentation.py
          git diff --cached --check
          git commit -m 'docs: audit user-facing documentation and help' || exit 0
          git push origin HEAD:documentation-user-audit
