name: documentation user audit

on:
  push:
    branches: [documentation-user-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: documentation-user-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Apply documentation audit
        run: python tools/_apply_documentation_user_audit.py

      - name: Finish user-facing wording cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          doc = Path('docs/documentation.html')
          text = doc.read_text(encoding='utf-8')
          old = '''    <p><b>Axis conventions in rotor and propeller mode.</b> In rotor mode, $\\mu_x$ denotes the in-plane advance
              ratio and $\\mu_z$ denotes axial inflow along the shaft. In propeller mode, the shaft is aligned
              longitudinally, so the displayed labels rotate: axial flight speed corresponds to $\\mu_x$ (or $J_x$), while
              vertical cross-flow corresponds to $\\mu_z$ (or $J_z$). Internal solver variables maintain
              disk-aligned coordinates (axial flow stored under <code>mu_z</code>, <code>J_z</code> and <code>Vz</code>),
              while the user interface adjusts the input labels according to the operating mode (<a class="xref"
                href="#cap-5-1" title="10.1 In-plane flow — the first row">Section 10.1</a>).</p>'''
          new = '''    <p><b>Axis conventions in rotor and propeller mode.</b> Rotor mode uses $\\mu_x$ for in-plane advance ratio and $\\mu_z$ for axial inflow along the shaft. Propeller mode uses shaft-oriented labels: axial flight speed is shown as $\\mu_x$ (or $J_x$), while vertical cross-flow is shown as $\\mu_z$ (or $J_z$). The selected operating mode therefore changes the displayed convention, not the physical direction of the flow (<a class="xref" href="#cap-5-1" title="10.1 In-plane flow — the first row">Section 10.1</a>).</p>'''
          if old not in text:
              raise SystemExit('axis-convention paragraph was not found')
          doc.write_text(text.replace(old, new, 1), encoding='utf-8')

          blocks = Path('zbemt/gui/help_blocks.py')
          text = blocks.read_text(encoding='utf-8')
          old = 'Instead of Cl = Cl_α(α − α₀) with a stall closure, the engine interpolates directly between the tabulated points.'
          new = 'Instead of Cl = Cl_α(α − α₀) with a stall closure, the tabulated coefficients are interpolated directly between the supplied points.'
          if old not in text:
              raise SystemExit('tabulated-polar implementation wording was not found')
          blocks.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'

      - name: Run documentation and help architecture tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tests.run_all_tests import _run_one

          root = Path.cwd()
          env = os.environ.copy()
          env.setdefault("QT_QPA_PLATFORM", "offscreen")
          files = [
              root / "tests/architecture/test_documentation.py",
              root / "tests/architecture/test_help_content.py",
              root / "tests/architecture/test_every_field_has_a_popup.py",
              root / "tests/architecture/test_user_facing_documentation.py",
          ]
          failed = []
          for path in files:
              ok, summary, output = _run_one(path, env)
              print(f"{path.name}: {summary}")
              if not ok:
                  failed.append(path.name)
                  print(output)
          if failed:
              raise SystemExit("Failed: " + ", ".join(failed))
          PY

      - name: Commit audited documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/documentation.html docs/software_requirements.md zbemt/gui/help_content.py zbemt/gui/help_blocks.py tests/architecture/test_user_facing_documentation.py
          git diff --cached --check
          git commit -m 'docs: audit user-facing documentation and help' || exit 0
          git push origin HEAD:documentation-user-audit
