name: Pitt-Peters periodic gate
on:
  push:
    branches:
      - inflow-global-models
    paths:
      - .github/workflows/_pitt_periodic_gate.yml
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: inflow-global-models
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/_patch_pitt_periodic_contract.py
      - name: Compile
        run: python -m py_compile zbemt/bemt.py zbemt/studies.py zbemt/validation.py zbemt/gui/tabs/config.py zbemt/gui/help_content.py zbemt/gui/help_blocks.py
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1
          python -m pip install -e '.[dev,gui]'
      - name: Targeted tests
        run: |
          python -m pytest -q tests/regression/test_pitt_peters_periodic_case.py tests/regression/test_pitt_peters_inflow.py tests/regression/test_dynamic_stall_methods.py tests/regression/test_validation.py tests/architecture/test_help_content.py tests/architecture/test_help_registry.py tests/architecture/test_documentation.py tests/architecture/test_user_facing_documentation.py
      - name: GUI gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a python - <<'PY'
          from PyQt6.QtWidgets import QApplication
          from zbemt import api
          from zbemt.gui.common import AppState
          from zbemt.gui.tabs.config import ConfigMotorTab
          app = QApplication.instance() or QApplication([])
          state = AppState()
          state.set_project(api.open_project('projects/starter_rotor'))
          tab = ConfigMotorTab(state)
          tab.show()
          tab.cfg_inflow_family.setCurrentText('pitt_peters')
          values = [tab.cfg_inflow_coupling.itemData(i) for i in range(tab.cfg_inflow_coupling.count())]
          assert values == ['steady', 'unsteady'], values
          tab.cfg_inflow_coupling.setCurrentIndex(tab.cfg_inflow_coupling.findData('unsteady'))
          app.processEvents()
          assert tab._inflow_field_model_from_widgets() == 'pitt_peters_unsteady'
          assert tab.cfg_pitt_peters_time_march_revolutions.isVisibleTo(tab)
          assert tab.cfg_pitt_peters_time_march_avg_last.isVisibleTo(tab)
          print('GUI steady/dynamic Pitt-Peters verified')
          tab.close()
          app.quit()
          PY
      - name: Help and documentation semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          from zbemt.gui.help_content import FIELD_HELP
          from zbemt.gui.help_blocks import BLOCK_HELP
          text = Path('docs/documentation.html').read_text(encoding='utf-8')
          body = '\n'.join(BLOCK_HELP['pitt_peters']['body'])
          option = FIELD_HELP['inflow_field_model']['options']['pitt_peters_unsteady']
          assert 'pitt_peters_unsteady' in text
          assert 'Dynamic (time march)' in text
          assert 'does not need a maneuver' in body
          assert 'does not require a maneuver' in option
          assert 'name misleads' not in text
          print('help/documentation semantics verified')
          PY
      - name: Commit product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zbemt/bemt.py zbemt/studies.py zbemt/validation.py zbemt/gui/tabs/config.py zbemt/gui/help_content.py zbemt/gui/help_blocks.py docs/documentation.html tests/regression/test_pitt_peters_periodic_case.py tests/regression/test_validation.py tests/suite_manifest.json
          git commit -m 'feat: time-march Pitt-Peters in fixed cases'
          git push origin HEAD:inflow-global-models
