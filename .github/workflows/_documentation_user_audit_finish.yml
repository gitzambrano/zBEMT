name: finish documentation audit

on:
  push:
    branches: [documentation-user-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: documentation-user-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Finalize documentation files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          blocks = Path('zbemt/gui/help_blocks.py')
          text = blocks.read_text(encoding='utf-8')
          replacements = {
              "Comparison variants are not persisted. The table is rebuilt from the project's own geometry on every load, so a comparison worth keeping should be re-created deliberately or exported before closing. Design optimization is not part of this window: it runs as an outer loop from the command line or the library.":
                  "Comparison variants are not persisted. Export a comparison that must be retained. Use the Optimization window for persistent design-optimization studies.",
              "A derivative study is a persisted perturbation plan (SC-14): which states and controls to nudge, about which trim point, with which finite-difference steps. It lives in inputs/derivatives.bemt beside the project.":
                  "A derivative study stores the perturbation plan: which states and controls to vary, the reference trim point, and the finite-difference steps. It is saved with the project in inputs/derivatives.bemt.",
              "Run the trim ALONE first and read its controls and loads. A trim that surprises you will surprise every derivative built on top of it.":
                  "Run the trim first and check its controls and loads. Every derivative is referenced to this state.",
              "The SIGN CHECKS panel is why the window can be trusted: heave damping must be negative, pitch damping must be negative, thrust must rise with collective.":
                  "The <b>Sign checks</b> panel verifies basic expected trends: heave damping should be negative, pitch damping should be negative, and thrust should increase with collective.",
              "an empty second box drives ONE quantity with the global search":
                  "an empty second box drives one quantity with the global search",
              "differential evolution drives the FIRST objective only":
                  "differential evolution drives the first objective only",
              "Each selected variable gets TWO solves per derivative (plus/minus the step), or FOUR when the Richardson half-step check is on":
                  "Each selected variable requires two evaluations per derivative (plus and minus the step), or four when the Richardson half-step check is enabled",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'unexpected help text count: {old[:70]} -> {count}')
              text = text.replace(old, new, 1)
          blocks.write_text(text, encoding='utf-8')

          content = Path('zbemt/gui/help_content.py')
          text = content.read_text(encoding='utf-8')
          if text.count('(SC-12)') != 1:
              raise SystemExit(f'unexpected SC-12 count: {text.count("(SC-12)")}')
          content.write_text(text.replace(' (SC-12)', '', 1), encoding='utf-8')

          test = Path('tests/architecture/test_user_facing_documentation.py')
          test.write_text('''"""Keep user-facing documentation separate from source-code internals."""\nfrom __future__ import annotations\n\nfrom pathlib import Path\nimport re\nimport unittest\n\nfrom zbemt.gui.help_blocks import BLOCK_HELP\nfrom zbemt.gui.help_content import FIELD_HELP\n\nROOT = Path(__file__).resolve().parents[2]\n\n\ndef _visible_html() -> str:\n    html = (ROOT / "docs" / "documentation.html").read_text(encoding="utf-8")\n    body = html.split("<body", 1)[-1]\n    body = re.sub(r"<script\\b.*?</script>", " ", body, flags=re.S | re.I)\n    body = re.sub(r"<style\\b.*?</style>", " ", body, flags=re.S | re.I)\n    body = re.sub(r"<!--.*?-->", " ", body, flags=re.S)\n    return body\n\n\ndef _flatten_strings(value) -> str:\n    if isinstance(value, str):\n        return value\n    if isinstance(value, dict):\n        return "\\n".join(_flatten_strings(v) for v in value.values())\n    if isinstance(value, (list, tuple, set)):\n        return "\\n".join(_flatten_strings(v) for v in value)\n    return ""\n\n\nclass TestUserFacingDocumentationBoundary(unittest.TestCase):\n    """DC-5 permits useful engine explanations but not source-code internals."""\n\n    def test_documentation_has_no_source_code_surface(self):\n        body = _visible_html()\n        forbidden = {\n            "python module launch path": r"python\\s+-m\\s+zbemt\\.",\n            "config object attribute": r"\\bcfg\\.[A-Za-z_]",\n            "test project": r"projects/test\\d+",\n            "source module path": r"\\bzbemt\\.(?:gui|cli|core|solver)(?:\\.[A-Za-z_][A-Za-z0-9_]*)+",\n            "python source file": r"\\b[A-Za-z_][A-Za-z0-9_]*\\.py\\b",\n        }\n        for label, pattern in forbidden.items():\n            with self.subTest(label=label):\n                self.assertIsNone(re.search(pattern, body, flags=re.I), label)\n\n    def test_popup_copy_has_no_requirement_ids_or_source_objects(self):\n        visible_help = _flatten_strings(FIELD_HELP) + "\\n" + _flatten_strings(BLOCK_HELP)\n        forbidden = {\n            "requirement id": r"\\b(?:SC|DC|FR|SR)-\\d+\\b",\n            "config object attribute": r"\\bcfg\\.[A-Za-z_]",\n            "python module path": r"\\bzbemt\\.(?:gui|cli|core|solver)\\.",\n            "test project": r"projects/test\\d+",\n        }\n        for label, pattern in forbidden.items():\n            with self.subTest(label=label):\n                self.assertIsNone(re.search(pattern, visible_help), label)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          manifest_path = Path('tests/suite_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          name = 'tests/architecture/test_user_facing_documentation.py'
          if name not in manifest['architecture']:
              i = manifest['architecture'].index('tests/architecture/test_documentation.py') + 1
              manifest['architecture'].insert(i, name)
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          orchestrator = Path('tests/architecture/test_quality_orchestrator.py')
          text = orchestrator.read_text(encoding='utf-8')
          if '"test_user_facing_documentation.py"' not in text:
              old = '            "test_documentation.py",\n'
              new = old + '            "test_user_facing_documentation.py",\n'
              if text.count(old) != 1:
                  raise SystemExit('unexpected quality-orchestrator architecture list')
              text = text.replace(old, new, 1)
          orchestrator.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/_documentation_user_audit.yml
          git rm .github/workflows/_documentation_user_audit_finish.yml
          git rm tools/_apply_documentation_user_audit.py
          git rm tools/_apply_documentation_user_audit_extra.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'

      - name: Run architecture and help tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tests.run_all_tests import _run_one

          root = Path.cwd()
          env = os.environ.copy()
          env.setdefault('QT_QPA_PLATFORM', 'offscreen')
          manifest = json.loads((root / 'tests/suite_manifest.json').read_text(encoding='utf-8'))
          paths = [root / p for p in manifest['architecture']]
          paths.append(root / 'tests/regression/test_field_help.py')
          failed = []
          for path in paths:
              ok, summary, output = _run_one(path, env)
              print(f'{path.name}: {summary}')
              if not ok:
                  failed.append(path.name)
                  print(output)
          if failed:
              raise SystemExit('Failed: ' + ', '.join(failed))
          PY

      - name: Commit and push final audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: finalize user-facing documentation audit'
          git push origin HEAD:documentation-user-audit
