          python tests/run_all_tests.py --suite regression -k stability_window
          python tests/run_all_tests.py --suite regression -k transient_window
      - name: Capture refactored Tools at notebook and desktop sizes
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          os.environ.setdefault('QT_QPA_PLATFORM', 'offscreen')
          from PyQt6.QtWidgets import QApplication, QTabWidget
          from zbemt import api
          from zbemt.gui import app as gui
          from zbemt.gui import styles

          out = Path('tools-ux-refactor-artifacts')
          out.mkdir(exist_ok=True)
          app = QApplication.instance() or QApplication([])
          app.setStyle('Fusion')
          app.setStyleSheet(styles.APP_QSS)
          def settle(n=35):
              for _ in range(n): app.processEvents()

          main = gui.MainWindow()
          main.state.set_project(api.open_project('projects/starter_rotor'))
          main.show(); settle()
          # Launcher itself.
          main.flow_bar.btn_tools.click(); settle()
          main.flow_bar._tools_launcher.grab().save(str(out / 'tools-launcher.png'))
          main.flow_bar._tools_launcher.hide()

          windows = [
              ('designer', main.geometry_designer),
              ('transient', main.transient_window),
              ('optimizer', main.optimizer_window),
              ('stability', main.stability_window),
          ]
          for width, height in ((1366, 768), (1100, 700)):
              d = out / f'{width}x{height}'; d.mkdir(exist_ok=True)
              for slug, window in windows:
                  window.resize(width, height); window.show(); settle()
                  tabs = window.pages
                  for i in range(tabs.count()):
                      tabs.setCurrentIndex(i); settle()
                      name = tabs.tabText(i).replace(' ', '-').replace('&', 'and').lower()
                      target = d / f'{slug}-{i+1}-{name}.png'
                      window.grab().save(str(target))
                      assert target.stat().st_size > 0
                  window.hide()
          sys.stdout.flush(); sys.stderr.flush(); os._exit(0)
          PY
