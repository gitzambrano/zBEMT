name: inflow global models full regression

# Final feature-branch full-suite gate; remove this temporary workflow before merge.
on:
  push:
    branches: [inflow-global-models]
    paths:
      - "zbemt/bemt.py"
      - "tests/regression/test_global_inflow_models.py"
      - "tests/suite_manifest.json"
      - ".github/workflows/_inflow_global_full_tests.yml"
  workflow_dispatch:

concurrency:
  group: inflow-global-full-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  engine:
    name: engine + CLI, Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install base + dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Complete engine regression
        run: |
          set +e
          python tests/run_all_tests.py
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat tests/test_results.txt || true
            exit "$status"
          fi

  gui:
    name: complete suite with GUI, Python 3.12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - name: Install all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Complete regression including GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python tests/run_all_tests.py
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat tests/test_results.txt || true
            exit "$status"
          fi
