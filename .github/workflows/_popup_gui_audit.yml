name: notebook GUI responsive audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[optimizer-responsive-audit]') }}
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install zBEMT
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'

      - name: Apply notebook layout fixes
        run: |
          python tools/_optimizer_responsive_audit.py
          git diff --check

      - name: Commit locally and rebase onto latest main
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add zbemt/gui/tabs/optimizer_window.py zbemt/gui/tabs/transient_window.py tests/regression/test_optimizer_window.py tests/regression/test_small_screen.py
          git commit -m 'fix: keep tool pages accessible on notebook screens'
          git fetch origin main
          git rebase origin/main

      - name: Run responsive regression tests
        run: |
          python tests/run_all_tests.py --suite regression -k optimizer_window
          python tests/run_all_tests.py --suite regression -k tools_window_layout
          python tests/run_all_tests.py --suite regression -k small_screen
          python tests/run_all_tests.py --suite regression -k gui_layout
          python tests/run_all_tests.py --suite regression -k plot_scaling
          python tests/run_all_tests.py --suite architecture

      - name: Capture all GUI views at notebook sizes
        run: |
          rm -rf gui-review
          mkdir -p gui-review
          for spec in 1100x650 1280x720 1366x768 1440x900 1600x900 1920x1080; do
            export W=${spec%x*}
            export H=${spec#*x}
            export OUT=gui-review/$spec
            mkdir -p "$OUT"
            python - <<'PY'
          import os
          import sys
          from pathlib import Path
          import tools.gui_screenshots as shots
          shots.WIDTH = int(os.environ['W'])
          shots.HEIGHT = int(os.environ['H'])
          written = shots.generate(Path(os.environ['OUT']))
          expected = len(shots.SHOTS) + 4
          if len(written) != expected:
              raise SystemExit(f'Expected {expected} screenshots, got {len(written)}')
          print(f'Captured {len(written)} GUI views at {shots.WIDTH}x{shots.HEIGHT}.')
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(0)
          PY
          done
          count=$(find gui-review -type f -name '*.png' | wc -l)
          test "$count" -eq 72
          find gui-review -type f -name '*.png' -size 0 -print -quit | grep -q . && exit 1 || true
          echo "Captured $count screenshots."

      - uses: actions/upload-artifact@v4
        with:
          name: gui-notebook-matrix-final
          path: gui-review
          if-no-files-found: error
          retention-days: 2

      - name: Run full suite
        run: python tests/run_all_tests.py

      - name: Push validated notebook fixes
        run: git push origin HEAD:main
