name: optimizer responsive audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[optimizer-responsive-audit]') }}
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install zBEMT
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all]'

      - name: Harden Optimizer for notebook heights
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('zbemt/gui/tabs/optimizer_window.py')
          text = src.read_text(encoding='utf-8')
          replacements = {
              'from ..common import (AppState, CanvasHost, equalize_button_widths,\n'
              '                      show_error, show_all_options_in)':
              'from ..common import (AppState, CanvasHost, equalize_button_widths,\n'
              '                      show_error, show_all_options_in, in_scroll_area)',
              '        tabs = QTabWidget(self)\n'
              '        tabs.addTab(self._build_definition_page(), "Study")\n'
              '        tabs.addTab(self._build_run_page(), "Run and results")':
              '        tabs = QTabWidget(self)\n'
              '        tabs.addTab(in_scroll_area(self._build_definition_page()), "Study")\n'
              '        tabs.addTab(in_scroll_area(self._build_run_page()), "Run and results")',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one optimizer source match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          src.write_text(text, encoding='utf-8')

          test = Path('tests/regression/test_optimizer_window.py')
          text = test.read_text(encoding='utf-8')
          marker = '''    def test_a_project_populates_the_lists_and_enables_the_run(self):
          self._load_project_with_study()
          self.assertEqual(self.window.study_combo.count(), 1)
          self.assertTrue(self.window.btn_run.isEnabled())
          definition = self.window._current_definition()
          self.assertEqual([o.key for o in definition.objectives],
                           ["CT", "FM"])
          self.assertEqual(definition.condition.rpm, 800.0)
'''
          addition = marker + '''
    def test_study_cost_estimate_is_reachable_on_notebook_screen(self):
        """The Study page must scroll instead of clipping its last block."""
        from PyQt6.QtWidgets import QScrollArea, QTabWidget

        self.window.resize(1100, 650)
        self.window.show()
        QApplication.processEvents()
        tabs = self.window.findChild(QTabWidget)
        self.assertIsNotNone(tabs)
        area = tabs.widget(0)
        self.assertIsInstance(area, QScrollArea)
        bar = area.verticalScrollBar()
        self.assertGreater(bar.maximum(), 0,
                           "the Study page must scroll at 1100x650")
        bar.setValue(bar.maximum())
        QApplication.processEvents()
        top = self.window.cost_label.mapTo(
            area.viewport(), self.window.cost_label.rect().topLeft()).y()
        bottom = top + self.window.cost_label.height()
        self.assertGreaterEqual(top, 0)
        self.assertLessEqual(bottom, area.viewport().height() + 2)
'''
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f'Expected one optimizer test insertion point, found {count}')
          text = text.replace(marker, addition, 1)
          test.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Run targeted responsive tests before commit
        run: |
          python tests/run_all_tests.py --suite regression -k optimizer_window
          python tests/run_all_tests.py --suite regression -k tools_window_layout
          python tests/run_all_tests.py --suite regression -k small_screen
          python tests/run_all_tests.py --suite regression -k gui_layout
          python tests/run_all_tests.py --suite regression -k plot_scaling

      - name: Prepare final commit and rebase onto latest main
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add zbemt/gui/tabs/optimizer_window.py tests/regression/test_optimizer_window.py
          git rm .github/workflows/_popup_gui_audit.yml
          git diff --cached --check
          git commit -m 'fix: make optimizer responsive on notebook screens'
          git fetch origin main
          git rebase origin/main

      - name: Re-run responsive tests after rebase
        run: |
          python tests/run_all_tests.py --suite regression -k optimizer_window
          python tests/run_all_tests.py --suite regression -k tools_window_layout
          python tests/run_all_tests.py --suite regression -k small_screen
          python tests/run_all_tests.py --suite regression -k gui_layout
          python tests/run_all_tests.py --suite regression -k plot_scaling
          python tests/run_all_tests.py --suite architecture

      - name: Capture final GUI matrix after rebase
        run: |
          rm -rf gui-review
          mkdir -p gui-review
          for spec in 1100x650 1280x720 1366x768 1440x900 1600x900 1920x1080; do
            export W=${spec%x*}
            export H=${spec#*x}
            export OUT=gui-review/$spec
            mkdir -p "$OUT"
            python - <<'PY'
          import os
          import sys
          from pathlib import Path
          import tools.gui_screenshots as shots
          shots.WIDTH = int(os.environ['W'])
          shots.HEIGHT = int(os.environ['H'])
          written = shots.generate(Path(os.environ['OUT']))
          expected = len(shots.SHOTS) + 4
          if len(written) != expected:
              raise SystemExit(f'Expected {expected} screenshots, got {len(written)}')
          print(f'Captured {len(written)} GUI views at {shots.WIDTH}x{shots.HEIGHT}.')
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(0)
          PY
          done
          count=$(find gui-review -type f -name '*.png' | wc -l)
          test "$count" -eq 72
          find gui-review -type f -name '*.png' -size 0 -print -quit | grep -q . && exit 1 || true
          echo "Captured $count final screenshots."

      - uses: actions/upload-artifact@v4
        with:
          name: gui-notebook-matrix-final
          path: gui-review
          if-no-files-found: error
          retention-days: 2

      - name: Run full suite after rebase
        run: python tests/run_all_tests.py

      - name: Push validated final commit
        run: git push origin HEAD:main
